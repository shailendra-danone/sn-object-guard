name: SN Object Guard CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Compile TypeScript
        run: npx -p typescript@5.3.3 tsc -p ./

      - name: Run Integration Tests
        run: node scratch/test_runner.js

      - name: Package Extension (.vsix)
        run: npx --yes @vscode/vsce package --no-git-tag-version --no-dependencies
        continue-on-error: true

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sn-object-guard-extension
          path: '*.vsix'
        continue-on-error: true
