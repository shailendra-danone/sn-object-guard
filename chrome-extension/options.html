<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SN Object Guard Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #11111b;
      color: #cdd6f4;
      max-width: 600px;
      margin: 40px auto;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #313244;
    }
    h1 {
      font-size: 20px;
      color: #89b4fa;
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 13px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #45475a;
      background: #181825;
      color: #cdd6f4;
      box-sizing: border-box;
    }
    button {
      background: #89b4fa;
      color: #11111b;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #a6e3a1;
    }
  </style>
</head>
<body>
  <h1>🛡️ SN Object Guard Configuration</h1>
  
  <div class="form-group">
    <label for="devHost">DEV Instance Hostname</label>
    <input type="text" id="devHost" value="danonedev.service-now.com">
  </div>

  <div class="form-group">
    <label for="testHost">TEST Instance Hostname</label>
    <input type="text" id="testHost" value="danonetest.service-now.com">
  </div>

  <div class="form-group">
    <label for="uatHost">UAT Instance Hostname</label>
    <input type="text" id="uatHost" value="danoneuat.service-now.com">
  </div>

  <div class="form-group">
    <label for="prodHost">PROD Instance Hostname</label>
    <input type="text" id="prodHost" value="danoneprod.service-now.com">
  </div>

  <button id="save-btn">Save Configuration</button>
  <div id="status" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
